plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.easit.aiscanner'
    compileSdk 37

    defaultConfig {
        applicationId 'com.easit.aiscanner'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '4.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        // Still used by the overlay services (floating bubble and region selector).
        viewBinding true
        buildConfig true
    }

    packaging {
        resources.excludes += [
            'META-INF/AL2.0',
            'META-INF/LGPL2.1'
        ]
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // Views are only left in the overlay services and the transparent capture activities.
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'androidx.activity:activity-ktx:1.13.0'

    // livedata-ktx: Room's LiveData query, read with asFlow() on the saved-scan screen.
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // Jetpack Compose with Material 3 Expressive
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3:1.5.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.hilt:hilt-lifecycle-viewmodel-compose:1.3.0'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.2'

    // CameraX for the live barcode scanner
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.camera:camera-mlkit-vision:1.6.2'


    // Prefer Play Services-delivered vision models to keep installs smaller.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-language-id:17.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-smart-reply:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    // Document scanner: edge detection, perspective correction and clean-up for camera photos.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:entity-extraction:16.0.0-beta6'

    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'androidx.sqlite:sqlite:2.7.0'
    ksp 'androidx.room:room-compiler:2.8.4'
    testImplementation 'androidx.room:room-testing:2.8.4'

    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
